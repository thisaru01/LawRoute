config:
  target: "http://localhost:5000"
  phases:
    - duration: 60 # seconds
      arrivalRate: 5 # new virtual users per second
      name: "Steady load on cases API"
  defaults:
    headers:
      Content-Type: "application/json"

scenarios:
  - name: "Lawyer: Login, List Cases, Get Case Meetings"
    flow:
      - post:
          url: "/api/auth/login"
          json:
            email: "lawyer@gmail.com"
            password: "123456W@"
          capture:
            - json: "$.token"
              as: token
      - get:
          url: "/api/cases/my"
          headers:
            Authorization: "Bearer {{ token }}"
          capture:
            - json: "$.data[0]._id"
              as: caseId
      - get:
          url: "/api/cases/{{ caseId }}/meetings"
          headers:
            Authorization: "Bearer {{ token }}"
